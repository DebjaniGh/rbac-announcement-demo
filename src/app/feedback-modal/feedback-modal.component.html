<div class="modal-header border-0 pb-0">
  <h4 class="modal-title h3 fw-bold">
    <div class="d-flex align-items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-chat-heart text-primary" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M2.965 12.695a1 1 0 0 0-.287-.801C1.618 10.83 1 9.468 1 8c0-3.192 3.004-6 7-6s7 2.808 7 6c0 3.193-3.004 6-7 6a8.06 8.06 0 0 1-2.088-.272 1 1 0 0 0-.711.074c-.387.196-1.24.57-2.634.893a10.97 10.97 0 0 0 .398-2Zm-.8 3.108.02-.004c1.83-.363 2.948-.842 3.468-1.105A9.06 9.06 0 0 0 8 15c4.418 0 8-3.134 8-7s-3.582-7-8-7-8 3.134-8 7c0 1.76.743 3.37 1.97 4.6a10.437 10.437 0 0 1-.524 2.318l-.003.011a10.722 10.722 0 0 1-.244.637c-.079.186.074.394.273.362a21.673 21.673 0 0 0 .693-.125ZM8 5.993c1.664-1.711 5.825 1.283 0 5.132-5.825-3.85-1.664-6.843 0-5.132Z"/>
      </svg>
      Share Your Feedback
    </div>
  </h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <p class="text-secondary mb-4">We're constantly improving our platform and your feedback helps us make it better. What do you think about our new app?</p>
  <div class="form-group">
    <label for="feedbackMessage" class="form-label fw-medium">Your feedback</label>
    <textarea
      id="feedbackMessage"
      class="form-control"
      rows="4"
      [(ngModel)]="feedbackMessage"
      [disabled]="isSubmitting"
      placeholder="Tell us what you think..."
    ></textarea>
  </div>
</div>
<div class="modal-footer border-0 pt-0">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()" [disabled]="isSubmitting">
    <div class="d-flex align-items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-lg" viewBox="0 0 16 16">
        <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z"/>
      </svg>
      Cancel
    </div>
  </button>
  <button type="button" class="btn btn-primary" (click)="submit()" [disabled]="!feedbackMessage || isSubmitting">
    <div class="d-flex align-items-center gap-2">
      <svg *ngIf="!isSubmitting" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-send" viewBox="0 0 16 16">
        <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z"/>
      </svg>
      <div class="spinner-border spinner-border-sm" role="status" *ngIf="isSubmitting">
        <span class="visually-hidden">Loading...</span>
      </div>
      {{ isSubmitting ? 'Submitting...' : 'Submit Feedback' }}
    </div>
  </button>
</div>
