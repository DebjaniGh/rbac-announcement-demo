<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="card-title text-center mb-4">Login</h3>

          <!-- Error Alert -->
          <div *ngIf="error" class="alert alert-danger" role="alert">
            {{ error }}
          </div>

          <!-- Success Alert -->
          <div *ngIf="loggedInUser" class="alert alert-success" role="alert">
            <strong>Welcome, {{ loggedInUser.username }}!</strong><br />
            Role: {{ loggedInUser.role }} | ID: {{ loggedInUser.id }}
          </div>

          <!-- Login Form -->
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input
                type="text"
                class="form-control"
                id="username"
                [(ngModel)]="username"
                name="username"
                placeholder="Enter username"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                [(ngModel)]="password"
                name="password"
                placeholder="Enter password"
                required
              />
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100"
              [disabled]="isLoading"
            >
              <span
                *ngIf="isLoading"
                class="spinner-border spinner-border-sm me-2"
              ></span>
              {{ isLoading ? "Logging in..." : "Login" }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
